<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>{TITLE}</title>
<style>
:root{
  --ink:#1b1f24; --muted:#5b6470; --line:#d8dde3; --soft:#f4f6f8;
  --accent:#1f5fa8; --accent-soft:#e8f0fa;
  --bad:#b42318; --bad-soft:#fdecea; --good:#1a7f37; --good-soft:#e7f5ec;
  --warn:#9a6700; --warn-soft:#fff6db; --lab:#6f42c1; --lab-soft:#f1ecfb;
}
@page{ size:A4; margin:20mm 18mm 20mm 18mm;
  @bottom-right{ content: counter(page); font: 9pt "Noto Sans", sans-serif; color:#5b6470; }
  @bottom-left{ content: "{FOOTER}"; font: 8.5pt "Noto Sans", sans-serif; color:#8a939e; }
}
@page capa{ margin:0; @bottom-right{content:none} @bottom-left{content:none} }
html{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }
body{ font-family:"Noto Sans","Liberation Sans",sans-serif; font-size:10.3pt; line-height:1.52; color:var(--ink); background:#fff; margin:0; hyphens:auto; }
h1,h2,h3,h4{ line-height:1.25; break-after:avoid; }
h1{ font-size:21pt; color:var(--accent); margin:0 0 4mm; padding-bottom:3mm; border-bottom:2px solid var(--accent); break-before:page; }
h1 .num{ display:block; font-size:10pt; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); font-weight:600; margin-bottom:1mm; }
h2{ font-size:13.5pt; margin:6mm 0 2mm; color:#14324f; }
h3{ font-size:11.2pt; margin:4.5mm 0 1.5mm; }
p{ margin:0 0 2.6mm; text-align:justify; }
ul,ol{ margin:0 0 3mm; padding-left:6mm; } li{ margin-bottom:1mm; }
code{ font-family:"DejaVu Sans Mono",monospace; font-size:8.6pt; background:var(--soft); padding:0 1.2mm; border-radius:2px; }
pre{ font-family:"DejaVu Sans Mono",monospace; font-size:8.1pt; line-height:1.42; background:#f6f8fa; border:1px solid var(--line); border-left:3px solid #8a939e; padding:2.5mm 3mm; margin:0 0 3.5mm; white-space:pre-wrap; word-break:break-word; break-inside:avoid; }
pre code{ background:none; padding:0; font-size:inherit; }
pre.bad{ border-left-color:var(--bad); background:#fffafa; }
pre.good{ border-left-color:var(--good); background:#fbfffc; }
pre .lbl{ display:block; font-family:"Noto Sans",sans-serif; font-weight:700; font-size:7.8pt; letter-spacing:.06em; text-transform:uppercase; margin-bottom:1mm; }
pre.bad .lbl{ color:var(--bad); } pre.good .lbl{ color:var(--good); }
table{ width:100%; border-collapse:collapse; margin:0 0 4mm; font-size:9.2pt; break-inside:auto; }
th,td{ border:1px solid var(--line); padding:1.6mm 2mm; text-align:left; vertical-align:top; }
th{ background:var(--soft); font-weight:700; }
tr{ break-inside:avoid; }
.box{ border:1px solid var(--line); border-left:4px solid var(--accent); background:var(--accent-soft); padding:2.6mm 3.4mm; margin:0 0 4mm; break-inside:avoid; }
.box > :last-child{ margin-bottom:0; }
.box .t{ display:block; font-weight:700; font-size:8.6pt; letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.2mm; }
.obj{ border-left-color:var(--accent); } .obj .t{ color:var(--accent); }
.erro{ border-left-color:var(--bad); background:var(--bad-soft); } .erro .t{ color:var(--bad); }
.dica{ border-left-color:var(--good); background:var(--good-soft); } .dica .t{ color:var(--good); }
.caso{ border-left-color:var(--warn); background:var(--warn-soft); } .caso .t{ color:var(--warn); }
.lab{ border-left-color:var(--lab); background:var(--lab-soft); } .lab .t{ color:var(--lab); }
.gatilho{ border-left-color:#444; background:#f2f2f2; } .gatilho .t{ color:#333; }
.quiz{ border:1px solid var(--line); border-top:3px solid var(--ink); padding:3mm 4mm; margin:5mm 0 4mm; background:#fff; }
.quiz .t{ display:block; font-weight:800; font-size:9pt; letter-spacing:.08em; text-transform:uppercase; margin-bottom:2mm; }
.quiz ol{ margin-bottom:0; }
.feyn{ border:1.5px dashed #8a939e; padding:2.5mm 3.4mm; margin:0 0 4mm; break-inside:avoid; }
.feyn .t{ font-weight:700; font-size:8.6pt; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); display:block; margin-bottom:1mm; }
.linhas{ height:20mm; background:repeating-linear-gradient(#fff 0 6.6mm, #cfd5dc 6.6mm 6.9mm); margin-top:1mm; }
figure{ margin:0 0 4mm; break-inside:avoid; text-align:center; }
figcaption{ font-size:8.6pt; color:var(--muted); margin-top:1.2mm; }
svg text{ font-family:"Noto Sans",sans-serif; }
.small{ font-size:8.8pt; color:var(--muted); }
.two{ display:grid; grid-template-columns:1fr 1fr; gap:4mm; }
.tag{ display:inline-block; font-size:7.6pt; font-weight:700; padding:.3mm 1.6mm; border-radius:2mm; background:var(--soft); color:var(--muted); letter-spacing:.04em; }
.check li{ list-style:none; margin-left:-5mm; }
.check li::before{ content:"☐  "; color:var(--muted); }
.gab h3{ margin-top:3mm; }
.gab ol li{ margin-bottom:1.4mm; }
.toc{ columns:2; column-gap:8mm; font-size:9.6pt; }
.toc div{ break-inside:avoid; margin-bottom:1.4mm; }
.toc b{ color:var(--accent); display:inline-block; width:8mm; }
.capa{ page:capa; height:297mm; box-sizing:border-box; padding:34mm 22mm 20mm; background:linear-gradient(160deg,#0f2f52 0%,#1f5fa8 70%,#2c74c4 100%); color:#fff; position:relative; }
.capa .k{ font-size:10pt; letter-spacing:.2em; text-transform:uppercase; opacity:.8; }
.capa h1{ break-before:auto; border:none; color:#fff; font-size:34pt; margin:6mm 0 4mm; padding:0; line-height:1.1; }
.capa .sub{ font-size:13pt; opacity:.92; max-width:150mm; line-height:1.45; }
.capa .meta{ position:absolute; bottom:22mm; left:22mm; right:22mm; font-size:9.5pt; opacity:.85; border-top:1px solid rgba(255,255,255,.35); padding-top:4mm; }
.capa .itens{ margin-top:16mm; font-size:10.5pt; line-height:1.9; opacity:.95; }
.capa .itens span{ display:inline-block; border:1px solid rgba(255,255,255,.45); border-radius:4mm; padding:.4mm 3mm; margin:0 1.6mm 2mm 0; }
.nobreak{ break-inside:avoid; }
.fable{ border:1px solid #6f42c1; background:#f6f2fd; padding:3mm 4mm; margin:4mm 0; break-inside:avoid; }
.fable .t{ display:block; font-weight:700; font-size:8.6pt; letter-spacing:.07em; text-transform:uppercase; color:#6f42c1; margin-bottom:1mm; }
</style>
</head>
<body>
